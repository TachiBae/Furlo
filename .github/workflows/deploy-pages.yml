name: Deploy to GitHub Pages

on:
  push:
    branches: [fix/ui-audit]   # switch to [main] once fix/ui-audit is merged
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: furlo
        run: flutter pub get

      - name: Build web
        working-directory: furlo
        run: flutter build web --release --base-href "/Furlo/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: furlo/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
